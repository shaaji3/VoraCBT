name: CI Quality Gate

on:
  pull_request:
  push:
    branches: [ main, work ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, pdo_mysql, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP lint
        run: find app routes public resources tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JS syntax checks
        run: |
          node --check public/assets/js/pages/admin-dashboard.js
          node --check public/assets/js/pages/student-dashboard.js
          node --check public/assets/js/pages/exam.js
          node --check public/assets/js/components/Proctoring.js
          node --check public/assets/js/pages/ui-shell.js

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-fund --no-audit playwright
          npx playwright install --with-deps chromium

      - name: Start app server
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_PLUGIN_ROUTING: 'true'
          JWT_SECRET: ci-placeholder-secret
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: E2E checklist flow
        run: node scripts/e2e/checklist-flow.spec.mjs

      - name: Visual snapshots
        run: node scripts/e2e/visual-snapshots.mjs

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: artifacts/visual/*.png

      - name: Stop app server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill "$(cat /tmp/php-server.pid)" || true
          fi
